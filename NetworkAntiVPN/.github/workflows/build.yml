name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    name: Maven (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: mvn clean verify
        run: mvn -B -ntp clean verify

      - name: Upload built jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-jars
          path: |
            antivpn-core/target/*.jar
            antivpn-velocity/target/*.jar
            antivpn-paper/target/*.jar
            antivpn-purpur/target/*.jar
            antivpn-bungeecord/target/*.jar
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-surefire-reports
          path: "**/target/surefire-reports/*"
          if-no-files-found: ignore

  gradle:
    name: Gradle (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: gradle build
        run: ./gradlew build --console=plain

      - name: Upload built jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-jars
          path: "*/build/libs/*.jar"
          if-no-files-found: warn
